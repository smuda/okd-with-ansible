---
- name: Create or update the MachineConfig that enables iscsid on workers
  kubernetes.core.k8s:
    kubeconfig: "{{ openshift_files_kubeconfig }}"
    server_side_apply:
      field_manager: ansible
    resource_definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfig
      metadata:
        name: 50-workers-longhorn-iscsid
        labels:
          machineconfiguration.openshift.io/role: worker
      spec:
        config:
          ignition:
            version: 3.4.0
          systemd:
            units:
              - name: iscsid.service
                enabled: true
          storage:
            files:
              - path: /etc/modules-load.d/iscsi_tcp.conf
                mode: 0644
                overwrite: true
                contents:
                  source: data:,iscsi_tcp%0A

# MCO may not have noticed the new MachineConfig yet, so also require it in
# the rendered config before trusting the conditions
- name: Wait for the worker MachineConfigPool to roll out the MachineConfig
  kubernetes.core.k8s_info:
    kubeconfig: "{{ openshift_files_kubeconfig }}"
    api_version: machineconfiguration.openshift.io/v1
    kind: MachineConfigPool
    name: worker
  register: hosted_cluster_mcp
  retries: 270
  delay: 10
  until: >-
    hosted_cluster_mcp.resources | length == 1
    and '50-workers-longhorn-iscsid' in
    (hosted_cluster_mcp.resources[0].status.configuration.source | default([]) | map(attribute='name') | list)
    and hosted_cluster_mcp.resources[0].status.machineCount
    == hosted_cluster_mcp.resources[0].status.updatedMachineCount
    and (hosted_cluster_mcp.resources[0].status.conditions
    | selectattr('type', 'eq', 'Updated') | selectattr('status', 'eq', 'True') | list | length) == 1
    and (hosted_cluster_mcp.resources[0].status.conditions
    | selectattr('type', 'eq', 'Updating') | selectattr('status', 'eq', 'False') | list | length) == 1
    and (hosted_cluster_mcp.resources[0].status.conditions
    | selectattr('type', 'eq', 'Degraded') | selectattr('status', 'eq', 'False') | list | length) == 1

# Longhorn reads the annotation when it first creates its node object, so
# this must happen before the Helm install
- name: Label and annotate the hosted cluster node {{ hosted_cluster_node }}
  kubernetes.core.k8s:
    kubeconfig: "{{ openshift_files_kubeconfig }}"
    server_side_apply:
      field_manager: ansible
    resource_definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ hosted_cluster_node }}"
        # Ansible does not template dict keys, so build this with an expression
        labels: "{{ {'node.longhorn.io/create-default-disk': 'true', hosted_cluster_node_label_key: 'true'} }}"
        annotations:
          node.longhorn.io/default-node-tags: '["{{ longhorn_node_tag }}"]'

- name: Create or update namespace {{ longhorn_namespace }}
  kubernetes.core.k8s:
    kubeconfig: "{{ openshift_files_kubeconfig }}"
    server_side_apply:
      field_manager: ansible
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ longhorn_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: privileged

# The chart restricts everything but the UI, which proxies the Longhorn
# API without auth. A wider policy would undo the chart's own limits,
# since NetworkPolicies are additive.
- name: Create or update the NetworkPolicy longhorn-ui-internal
  kubernetes.core.k8s:
    kubeconfig: "{{ openshift_files_kubeconfig }}"
    server_side_apply:
      field_manager: ansible
    resource_definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: longhorn-ui-internal
        namespace: "{{ longhorn_namespace }}"
      spec:
        podSelector:
          matchLabels:
            app: longhorn-ui
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector: {}

- name: Install or update Longhorn
  kubernetes.core.helm:
    kubeconfig: "{{ openshift_files_kubeconfig }}"
    name: longhorn
    chart_ref: longhorn
    chart_repo_url: https://charts.longhorn.io
    chart_version: "{{ longhorn_chart_version }}"
    release_namespace: "{{ longhorn_namespace }}"
    wait: true
    values:
      openshift:
        enabled: true
        ui:
          route: ""
      persistence:
        defaultClass: false
      defaultSettings:
        createDefaultDiskLabeledNodes: true
        nodeDrainPolicy: allow-if-replica-is-stopped

- name: Create or update the StorageClass {{ hosted_cluster_storage_class }}
  kubernetes.core.k8s:
    kubeconfig: "{{ openshift_files_kubeconfig }}"
    server_side_apply:
      field_manager: ansible
    resource_definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ hosted_cluster_storage_class }}"
      provisioner: driver.longhorn.io
      allowVolumeExpansion: true
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      parameters:
        numberOfReplicas: "1"
        dataLocality: best-effort
        staleReplicaTimeout: "30"
        nodeSelector: "{{ longhorn_node_tag }}"

- name: Wait for the tag and a schedulable disk on Longhorn node {{ hosted_cluster_node }}
  kubernetes.core.k8s_info:
    kubeconfig: "{{ openshift_files_kubeconfig }}"
    api_version: longhorn.io/v1beta2
    kind: Node
    name: "{{ hosted_cluster_node }}"
    namespace: "{{ longhorn_namespace }}"
  register: hosted_cluster_longhorn_node
  retries: 60
  delay: 10
  until: >-
    hosted_cluster_longhorn_node.resources | length == 1
    and longhorn_node_tag in (hosted_cluster_longhorn_node.resources[0].spec.tags | default([]))
    and (hosted_cluster_longhorn_node.resources[0].status.diskStatus | default({}, true) | dict2items
    | selectattr('value.conditions', 'defined') | map(attribute='value.conditions') | flatten
    | selectattr('type', 'eq', 'Schedulable') | selectattr('status', 'eq', 'True') | list | length) > 0

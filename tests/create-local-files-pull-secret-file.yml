---
# Test: the create_local_files pull-secret.yml tasks must read the source
# pull secret from create_local_files_pull_secret_file instead of a hardcoded
# path. The task file is included directly to skip the role dependencies.
# Only fake credentials are used and the real pull-secret is never read.
# Needs jq, no network.
#
#   ansible-playbook tests/create-local-files-pull-secret-file.yml
- name: Use a custom pull secret file
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create scratch directory
      ansible.builtin.tempfile:
        state: directory
        prefix: create-local-files-test.
      register: scratch

    - name: Run role tasks against the scratch directory
      vars:
        openshift_files_directory: "{{ scratch.path }}/files"
        opt_out_of_remote_health_reporting: true
        use_disconnected_registry: false
      block:
        - name: Create files directory
          ansible.builtin.file:
            state: directory
            path: "{{ openshift_files_directory }}"
            mode: '0755'

        - name: Write custom source pull secret
          ansible.builtin.copy:
            content: '{"auths":{"fake":{"auth":"aWQ6cGFzcwo="},"cloud.openshift.com":{"auth":"eDp5"}}}'
            dest: "{{ scratch.path }}/custom-pull-secret"
            mode: '0644'

        - name: Generate pull secret from the custom file
          vars:
            create_local_files_pull_secret_file: "{{ scratch.path }}/custom-pull-secret"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/create_local_files/tasks/pull-secret.yml"

        - name: Read generated pull secret
          ansible.builtin.slurp:
            src: "{{ openshift_files_directory }}/pull-secret"
          register: generated

        - name: Assert the custom file was the source
          vars:
            generated_auths: "{{ (generated.content | b64decode | from_json).auths }}"
          ansible.builtin.assert:
            that:
              - generated_auths.keys() | list == ['fake']
              - "'cloud.openshift.com' not in generated_auths"

        - name: Missing custom file fails with the configured path
          vars:
            missing_pull_secret: "{{ scratch.path }}/does-not-exist"
          block:
            - name: Generate pull secret from a missing file
              vars:
                create_local_files_pull_secret_file: "{{ missing_pull_secret }}"
              ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/create_local_files/tasks/pull-secret.yml"

            - name: Fail if the missing file was accepted
              ansible.builtin.fail:
                msg: Role did not fail for a missing pull secret file
          rescue:
            - name: Assert the failure names the configured path
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is defined
                  - missing_pull_secret in ansible_failed_result.msg
                  - "'Role did not fail' not in ansible_failed_result.msg"
      always:
        - name: Remove scratch directory
          ansible.builtin.file:
            state: absent
            path: "{{ scratch.path }}"
